
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rpyxl"
version = "0.1.0"
description = "A high-performance, Rust-powered alternative to openpyxl"
authors = [{ name = "RPyXL Contributors" }]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "excel",
    "xlsx",
    "openpyxl",
    "rust",
    "pyo3",
    "spreadsheet",
    "high-performance",
    "streaming",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/franckoj/rpyxl"
Repository = "https://github.com/franckoj/rpyxl"
Documentation = "https://github.com/franckoj/rpyxl#readme"
Issues = "https://github.com/franckoj/rpyxl/issues"
Changelog = "https://github.com/franckoj/rpyxl/blob/main/docs/development_progress.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "openpyxl>=3.1.2",
    "python-calamine",
    "psutil>=5.9.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
]

[tool.maturin]
manifest-path = "crates/rpyxl-python/Cargo.toml"
module-name = "rpyxl._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
