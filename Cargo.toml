[workspace]
resolver = "2"
members = [
    "crates/rpyxl-core",
    "crates/rpyxl-ooxml",
    "crates/rpyxl-python",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["RPyXL Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/franckoj/rpyxl"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = true
