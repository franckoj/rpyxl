
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Rust Formatting and Clippy
  # ========================================
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ========================================
  # Rust and Python Compatibility Tests
  # ========================================
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Display Environment Information
        run: |
          python --version
          rustc --version
          cargo --version

      # ------------------------------------
      # Rust Tests
      # ------------------------------------
      # Test pure Rust crates separately.
      # Avoid linking PyO3 extension into
      # a Rust test executable on macOS.
      - name: Run Rust Core Tests
        run: cargo test -p rpyxl-core --verbose

      - name: Run Rust OOXML Tests
        run: cargo test -p rpyxl-ooxml --verbose

      # ------------------------------------
      # Python Dependencies
      # ------------------------------------
      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2.0"

      # ------------------------------------
      # Build Python Extension
      # ------------------------------------
      - name: Build Python Wheel
        run: |
          python -m maturin build \
            --release \
            --interpreter python \
            --out dist

      # ------------------------------------
      # Install Package and Test Dependencies
      # ------------------------------------
      - name: Install Python Wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl

      - name: Install Test Dependencies
        run: |
          python -m pip install \
            "pytest>=7.4.0" \
            "openpyxl>=3.1.2" \
            "python-calamine" \
            "psutil>=5.9.0" \
            "tabulate>=0.9.0"

      # ------------------------------------
      # Verify Package Imports
      # ------------------------------------
      - name: Verify Python Package
        run: |
          python -c "import rpyxl; print('RPyXL imported successfully')"
          python -c "import rpyxl._core; print('Rust extension imported successfully')"

      # ------------------------------------
      # Python Unit and Compatibility Tests
      # ------------------------------------
      - name: Run Python Tests
        run: |
          python -m pytest tests/ -v
