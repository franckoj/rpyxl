name: GitHub Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Create release with generated notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: >-
                  gh release create "$RELEASE_TAG"
                  --verify-tag
                  --generate-notes
                  --title "$RELEASE_TAG"
