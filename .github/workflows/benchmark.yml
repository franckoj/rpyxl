name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark.yml"
      - "crates/**"
      - "python/**"
      - "benchmarks/**"

jobs:
  benchmark:
    name: Run Comparative Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build rpyxl
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2.0" pytest openpyxl psutil tabulate matplotlib python-calamine
          python -m maturin build --release --interpreter python --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Run Benchmarks
        run: python benchmarks/run_benchmarks.py

      - name: Archive Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
